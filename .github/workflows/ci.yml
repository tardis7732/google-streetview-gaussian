name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: node --check src/google_streetview_gaussian/web/viewer-app.mjs
      - run: node --check src/google_streetview_gaussian/web/reference-renderer.mjs
      - run: python -m build
